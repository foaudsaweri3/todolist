<!DOCTYPE html>
<html>
<head>
    <title>Internet Monitor</title>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="5"> <!-- تحديث تلقائي كل 5 ثواني -->
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
        }
        
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .status {
            font-size: 48px;
            margin: 20px 0;
        }
        
        .online {
            color: #4CAF50;
        }
        
        .offline {
            color: #f44336;
        }
        
        .indicator {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 20px auto;
            animation: pulse 2s infinite;
        }
        
        .indicator.online {
            background: #4CAF50;
            box-shadow: 0 0 20px #4CAF50;
        }
        
        .indicator.offline {
            background: #f44336;
            box-shadow: 0 0 20px #f44336;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .data {
            font-size: 24px;
            margin: 20px 0;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .timestamp {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 مراقبة حالة الإنترنت</h1>
        
        <div class="status" id="statusText">
            جاري التحميل...
        </div>
        
        <div class="indicator" id="indicator"></div>
        
        <div class="data">
            📊 آخر تحديث: <span id="timestamp">--</span>
        </div>
        
        <div class="data">
            📱 عدد الرسائل: <span id="smsCount">0</span>
        </div>
        
        <button onclick="refreshData()">
            🔄 تحديث يدوي
        </button>
        
        <div class="timestamp">
            يتم التحديث تلقائياً كل 5 ثواني
        </div>
    </div>
    
    <script>
        // استبدل هذا الرابط برابط خادمك
        const API_URL = "http://YOUR_ESP_IP_ADDRESS/status";
        
        function updateStatus(data) {
            const statusDiv = document.getElementById('statusText');
            const indicator = document.getElementById('indicator');
            const timestamp = document.getElementById('timestamp');
            
            if (data.online === 1) {
                statusDiv.innerHTML = '🟢 الإنترنت متصل';
                statusDiv.className = 'status online';
                indicator.className = 'indicator online';
            } else {
                statusDiv.innerHTML = '🔴 الإنترنت مقطوع';
                statusDiv.className = 'status offline';
                indicator.className = 'indicator offline';
            }
            
            timestamp.innerHTML = new Date().toLocaleString();
            document.getElementById('smsCount').innerHTML = data.smsCount || 0;
        }
        
        async function refreshData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                updateStatus(data);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('statusText').innerHTML = '❌ خطأ في الاتصال';
            }
        }
        
        // تحديث تلقائي
        setInterval(refreshData, 5000);
        refreshData();  // تحديث أولي
    </script>
</body>
</html>
